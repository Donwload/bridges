<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мосты: Средневековье</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="game-header">
            <h1>🏰 Мосты</h1>
            <p class="subtitle">Соедини острова древними тропами</p>
        </header>

        <div class="game-container">
            <canvas
                id="gameCanvas"
                tabindex="0"
                role="application"
                aria-label="Игра Мосты. Соедините острова мостами так, чтобы число мостов вокруг каждого острова соответствовало указанному числу."
                aria-describedby="gameHelp gameStatus"
            ></canvas>
        </div>

        <p id="gameStatus" class="game-status" role="status" aria-live="polite"></p>

        <div class="game-help" id="gameHelp">
            <span>🖱️ ЛКМ / касание + перетягивание — соединить острова</span>
            <span>🖱️ ПКМ — удалить мост</span>
            <span>📱 На телефоне — коснитесь моста, чтобы удалить</span>
        </div>
    </div>

    <script src="logic.js"></script> <!-- Без изменений -->
    <script src="renderer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logic = new BridgesGameLogic(7);
            const generated = logic.generateValidLevel();
            if (!generated) {
                document.getElementById('gameStatus').textContent =
                    'Не удалось создать уровень. Попробуйте обновить страницу.';
            }
            const renderer = new BridgesGameRenderer('gameCanvas', logic);
        });
    </script>
</body>
</html>
